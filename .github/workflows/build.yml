name: Build GhostBat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create ONLY missing config files
        run: |
          if [ ! -f gradle.properties ]; then
            echo "android.useAndroidX=true" > gradle.properties
            echo "android.enableJetifier=true" >> gradle.properties
            echo "org.gradle.jvmargs=-Xmx2g" >> gradle.properties
          fi
          
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties 2>/dev/null || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties 2>/dev/null || true
          cat local.properties
          
          ls -la
          ls -la app/ || true

      - name: Build APK from your existing files
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          arguments: :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghostbat-cleaner-apk
          path: app/build/outputs/apk/debug/*.apk
